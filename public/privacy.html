<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Serif+Telugu:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js"></script>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="/">Atma<span>.</span></a>
      <div class="nav-right">
        <button id="lang-toggle" class="lang" data-i18n="switch_to">తెలుగు</button>
        <a class="btn ghost" href="/app.html" data-i18n="open_app">Open app</a>
      </div>
    </nav>
    <article class="page" data-i18n-html="privacy_html"></article>
    <footer data-i18n-html="footer_links"></footer>
  </div>
  <script>
    // Fill in the contact email (set CONTACT_EMAIL on the server).
    fetch("/api/config").then(r => r.json()).then(c => {
      CONTACT = c.contactEmail || "";
      applyLang();
    });
  </script>
</body>
</html>
