<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atma: Wisdom of the Upanishads</title>
  <meta name="description" content="Ask life's questions and receive guidance from the Upanishads, in English and Telugu: a daily verse, personal answers and simple practices.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Serif+Telugu:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d9771f">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-maskable-512.png">
  <script src="/pwa.js" defer></script>
  <script src="/i18n.js"></script>
  <script src="/verse-actions.js"></script>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="/">Atma<span>.</span></a>
      <div class="nav-right">
        <button id="lang-toggle" class="lang" data-i18n="switch_to">తెలుగు</button>
        <a class="btn ghost" href="/app.html" data-i18n="login">Log in</a>
      </div>
    </nav>

    <section class="hero">
      <h1 data-i18n-html="hero_title">Ancient wisdom for<br>the questions you carry today</h1>
      <p data-i18n="hero_sub"></p>
      <a class="btn" href="/app.html?signup=1" data-i18n="start_free">Start free</a>
      <p><button id="install-app" class="btn ghost hidden" type="button" data-i18n="install_app">Install app</button></p>
    </section>

    <h2 data-i18n="todays_verse">Today's verse</h2>
    <div id="votd" class="verse"><p class="en" data-i18n="loading">Loading…</p></div>

    <h2 data-i18n="how">How it works</h2>
    <div class="grid">
      <div class="card"><h3 data-i18n="step1_t"></h3><p data-i18n="step1_d"></p></div>
      <div class="card"><h3 data-i18n="step2_t"></h3><p data-i18n="step2_d"></p></div>
      <div class="card"><h3 data-i18n="step3_t"></h3><p data-i18n="step3_d"></p></div>
    </div>

    <h2 data-i18n="pricing">Pricing</h2>
    <div class="grid">
      <div class="card">
        <h3 data-i18n="free">Free</h3>
        <div class="price">$0</div>
        <ul><li data-i18n="f1"></li><li id="f2" data-i18n="f2"></li></ul>
        <a class="btn ghost" href="/app.html?signup=1" data-i18n="start_free">Start free</a>
      </div>
      <div class="card featured">
        <h3 data-i18n="seeker">Seeker</h3>
        <div class="price">$4.99<small style="font-size:16px" data-i18n="per_month">/month</small></div>
        <ul><li data-i18n="s1"></li><li data-i18n="s2"></li><li data-i18n="s3"></li></ul>
        <a class="btn" href="/app.html?signup=1" data-i18n="get_started">Get started</a>
      </div>
    </div>

    <footer><div data-i18n-html="footer"></div><p data-i18n-html="footer_links"></p></footer>
  </div>
  <script>
    fetch("/api/config").then(r => r.json()).then(c => {
      if (c.unlimited) { document.getElementById("f2").dataset.i18n = "f2_testing"; applyLang(); }
    });
    fetch("/api/verse-of-the-day").then(r => r.json()).then(v => {
      const box = document.getElementById("votd");
      box.dataset.verse = JSON.stringify(v);
      fillVerse(box);
    });
  </script>
</body>
</html>
