<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atma: Your Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Serif+Telugu:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d9771f">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-maskable-512.png">
  <script src="/pwa.js" defer></script>
  <script src="/i18n.js"></script>
  <script src="/verse-actions.js"></script>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="/">Atma<span>.</span></a>
      <div class="nav-right">
        <button id="lang-toggle" class="lang" data-i18n="switch_to">తెలుగు</button>
        <a id="stats-link" class="link hidden" href="/stats.html" data-i18n="stats">Stats</a>
        <button id="logout" class="link hidden" data-i18n="logout">Log out</button>
      </div>
    </nav>

    <!-- Sign up / log in -->
    <section id="auth" class="auth hidden">
      <h2 id="auth-title" style="margin-top:0"></h2>
      <button id="google" class="btn ghost google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span data-i18n="google_btn">Continue with Google</span>
      </button>
      <div class="or"><span data-i18n="or">or</span></div>
      <form id="auth-form">
        <input id="email" type="email" data-i18n-ph="email" autocomplete="email" required>
        <input id="password" type="password" data-i18n-ph="password" autocomplete="current-password" required minlength="8">
        <div id="auth-error" class="error"></div>
        <button class="btn" style="width:100%" data-i18n="continue">Continue</button>
      </form>
      <p style="text-align:center"><button id="auth-toggle" class="link"></button></p>
      <p style="text-align:center"><button id="forgot" class="link" data-i18n="forgot">Forgot password?</button></p>
    </section>

    <!-- Tabs (shown when signed in) -->
    <div id="tabs" class="tabs hidden">
      <button data-tab="main" class="active" data-i18n="tab_ask">💬 Ask</button>
      <button data-tab="coach" data-i18n="tab_coach">🎯 Coach</button>
      <button data-tab="journal" data-i18n="tab_journal">📔 Journal</button>
    </div>

    <!-- Coach: 7-day plans with daily check-ins -->
    <section id="coach" class="hidden">
      <p id="coach-loading" class="thinking" data-i18n="loading">Loading…</p>

      <!-- Start a plan -->
      <div id="coach-start" class="hidden">
        <h2 style="margin:8px 0;text-align:left" data-i18n="coach_title">Your scripture coach</h2>
        <p style="color:var(--muted);margin-top:0" data-i18n="coach_intro"></p>
        <div class="area-chips" id="area-chips">
          <button type="button" data-area="relationships" data-i18n="area_relationships"></button>
          <button type="button" data-area="emotions" data-i18n="area_emotions"></button>
          <button type="button" data-area="discipline" data-i18n="area_discipline"></button>
          <button type="button" data-area="career" data-i18n="area_career"></button>
          <button type="button" data-area="wealth" data-i18n="area_wealth"></button>
        </div>
        <p id="wealth-note" class="hidden" style="font-size:13px;color:var(--muted)" data-i18n="wealth_note"></p>
        <form id="coach-form" class="ask" style="position:static">
          <textarea id="coach-goal" data-i18n-ph="goal_ph" maxlength="500" required></textarea>
          <div id="coach-error" class="error"></div>
          <button id="coach-create" class="btn" style="width:100%" data-i18n="create_plan">Create my 7-day plan</button>
        </form>
      </div>

      <!-- Active / completed plan -->
      <div id="coach-plan" class="hidden">
        <div class="status">
          <h2 id="plan-title" style="margin:0;text-align:left"></h2>
          <span id="plan-day" class="badge"></span>
        </div>
        <div id="plan-dots" class="dots"></div>
        <div class="card sankalpa">
          <div class="lbl" data-i18n="sankalpa">Your sankalpa</div>
          <p id="plan-sankalpa"></p>
        </div>
        <p id="plan-why" style="color:var(--muted)"></p>
        <div id="plan-verses"></div>

        <div id="today-box" class="card today">
          <div class="lbl" id="today-label"></div>
          <p id="today-action" style="font-weight:600"></p>
          <div id="today-practice"></div>
          <div id="checkin-box">
            <textarea id="checkin-note" data-i18n-ph="checkin_ph" maxlength="1000"></textarea>
            <div class="checkin-buttons">
              <button id="checkin-done" class="btn" type="button" data-i18n="did_it">✅ I did it</button>
              <button id="checkin-skip" class="btn ghost" type="button" data-i18n="not_today">Not today</button>
            </div>
            <div id="checkin-error" class="error"></div>
          </div>
          <p id="checkin-wait" class="hidden" style="color:var(--muted)" data-i18n="come_back"></p>
        </div>

        <div id="coach-reply" class="msg guide hidden"></div>
        <div id="plan-complete" class="card hidden" style="text-align:center">
          <h3 data-i18n="plan_done_title"></h3>
          <button id="coach-new" class="btn" type="button" data-i18n="new_goal">Start a new goal</button>
        </div>

        <details class="history"><summary data-i18n="past_checkins">Past check-ins</summary><div id="plan-history"></div></details>
        <p style="text-align:center"><button id="coach-stop" class="link" type="button" data-i18n="end_plan">End this plan</button></p>
      </div>
    </section>

    <!-- Journal: past questions and answers -->
    <section id="journal" class="hidden">
      <div class="status">
        <h2 style="margin:0;text-align:left" data-i18n="journal">My journal</h2>
      </div>
      <p id="journal-empty" class="hidden" style="color:var(--muted)" data-i18n="journal_empty"></p>
      <div id="journal-list" class="chat"></div>
    </section>

    <!-- Main app -->
    <section id="main" class="hidden">
      <div class="status">
        <span id="plan"></span>
        <button id="upgrade" class="btn hidden" style="padding:8px 18px" data-i18n="upgrade_btn"></button>
        <button id="manage" class="link hidden" data-i18n="manage"></button>
      </div>
      <div id="notice" class="verse hidden"></div>

      <div id="chat" class="chat"></div>

      <div class="suggestions" id="suggestions">
        <button data-i18n="sugg1"></button>
        <button data-i18n="sugg2"></button>
        <button data-i18n="sugg3"></button>
        <button data-i18n="sugg4"></button>
      </div>

      <div id="upsell" class="card upsell hidden">
        <h3 data-i18n="upsell_t"></h3>
        <p style="margin-bottom:14px" data-i18n="upsell_d"></p>
        <button class="btn" data-upgrade data-i18n="upsell_btn"></button>
      </div>

      <form id="ask" class="ask">
        <textarea id="question" data-i18n-ph="question_ph" maxlength="2000" required></textarea>
        <button id="send" class="btn" style="width:100%" data-i18n="ask"></button>
      </form>
    </section>
    <footer data-i18n-html="footer_links"></footer>
  </div>
  <script src="/firebase-auth.js"></script>
  <script src="/app.js"></script>
</body>
</html>
